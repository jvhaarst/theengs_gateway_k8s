apiVersion: v1
kind: Secret
metadata:
  name: theengs-gateway-mqtt-credentials
  namespace: theengs
  labels:
    app.kubernetes.io/name: theengs-gateway
    app.kubernetes.io/component: ble-mqtt-bridge
type: Opaque
stringData:
  # Replace these with your actual MQTT credentials
  # Consider using a secrets management solution like:
  # - Sealed Secrets
  # - External Secrets Operator
  # - HashiCorp Vault
  MQTT_USERNAME: "your-mqtt-username"
  MQTT_PASSWORD: "your-mqtt-password"
