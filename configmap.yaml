apiVersion: v1
kind: ConfigMap
metadata:
  name: theengs-gateway-config
  namespace: theengs
  labels:
    app.kubernetes.io/name: theengs-gateway
    app.kubernetes.io/component: ble-mqtt-bridge
data:
  # MQTT Broker Configuration
  MQTT_HOST: "mqtt.home.local"
  MQTT_PORT: "1883"

  # MQTT Topics
  MQTT_PUBLISH_TOPIC: "home/TheengsGateway/BTtoMQTT"
  MQTT_SUBSCRIBE_TOPIC: "home/TheengsGateway/commands"
  MQTT_LWT_TOPIC: "home/TheengsGateway/LWT"

  # BLE Scanning Configuration
  SCANNING_MODE: "active"
  BLE_SCAN_TIME: "5"
  BLE_TIME_BETWEEN_SCANS: "5"
  # ADAPTER: "hci0"  # Uncomment to specify adapter, defaults to first available

  # Home Assistant Discovery
  DISCOVERY: "1"
  DISCOVERY_TOPIC: "homeassistant/sensor"
  DISCOVERY_DEVICE_NAME: "TheengsGateway"
  # DISCOVERY_FILTER: ""  # Comma-separated list of device models to include

  # Publishing Options
  PUBLISH_ALL: "0"
  # PUBLISH_ADVDATA: "0"

  # Presence Detection
  GENERAL_PRESENCE: "0"
  # PRESENCE_TOPIC: "home/TheengsGateway/presence"

  # Logging
  LOG_LEVEL: "INFO"

  # TLS (if using secure MQTT)
  # ENABLE_TLS: "0"
  # TLS_INSECURE: "0"
